name: telegramclone
description: Telegram clone messenger mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^13.0.0
  dio: ^5.4.0
  web_socket_channel: ^3.0.0
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  record: ^6.2.0
  video_player: ^2.8.0
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^17.0.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  path_provider: ^2.1.2
  uuid: ^4.3.3
  permission_handler: ^11.3.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

services:
  postgres:
    image: postgres:16-alpine
    container_name: telegramclone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-telegramclone}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telegramclone}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - telegramclone

  redis:
    image: redis:7-alpine
    container_name: telegramclone-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - telegramclone

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegramclone-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}@postgres:5432/${POSTGRES_DB:-telegramclone}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MIGRATIONS_DIR: /app/migrations
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telegramclone

  # Optional: start with  docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: telegramclone-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in server/.env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telegramclone

volumes:
  pgdata:
    name: telegramclone_pgdata
  redisdata:
    name: telegramclone_redisdata
  pgadmin_data:
    name: telegramclone_pgadmin_data
  uploads:
    name: telegramclone_uploads

networks:
  telegramclone:
    name: telegramclone_network
